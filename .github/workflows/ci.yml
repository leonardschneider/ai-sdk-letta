name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm
      - name: Install
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Test
        # Offline only: no Letta backend or model. The PTY tests use python3,
        # which ubuntu-latest provides; live tests are opt-in and skip here.
        run: npm test
      - name: Build
        run: npm run build
