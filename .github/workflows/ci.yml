name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: build (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # 22.19.0 is the minimum in every package's `engines`; 24 is what the
        # release workflow builds and publishes with.
        node: ['22.19.0', '22.x', '24.x']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - name: Install
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Test
        # Offline only: no Letta backend or model. The PTY tests use python3,
        # which ubuntu-latest provides; live tests are opt-in and skip here.
        run: npm test
      - name: Check docs
        # Typechecks every TypeScript block in docs/ and runs its offline test blocks.
        run: npm run check:docs
      - name: Build
        run: npm run build
      - name: Check published package contents
        # Runs `npm pack --dry-run` on the published packages; never publishes.
        run: npm run check:packages
